<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xNhau - Web Video Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0c10; color: #fff; }
    
    /* Header chuẩn xNhau */
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #12131a; border-bottom: 1px solid #1f212d; position: sticky; top: 0; z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .menu-icon { font-size: 22px; cursor: pointer; color: #fff; }
    .logo { font-size: 22px; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; }
    .logo span { color: #d000ff; }
    .search-icon { font-size: 18px; margin-left: 4px; cursor: pointer; }
    .header-right { display: flex; gap: 6px; }
    .btn-login { background: #222533; color: #ccc; border: none; padding: 6px 12px; border-radius: 18px; font-size: 12px; font-weight: 600; }
    .btn-register { background: #0084ff; color: #fff; border: none; padding: 6px 12px; border-radius: 18px; font-size: 12px; font-weight: bold; }

    /* Khung chứa nội dung */
    .container { padding: 8px; }

    /* Banner quảng cáo mô phỏng */
    .ad-banner { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; background: #181a24; text-align: center; }
    .ad-banner img { width: 100%; display: block; border-radius: 8px; }

    /* Lưới Video 2 cột */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .card { background: #161822; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; }
    .thumb-box { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
    .thumb-box iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
    
    /* Nhãn HD & Thời lượng video */
    .badge-hd { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: #fff; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); }
    .badge-time { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 500; }

    .info { padding: 8px 8px 10px; }
    .title { font-size: 12px; font-weight: 600; color: #e1e4ed; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }

    /* Trình phát Pop-up */
    dialog { border: none; border-radius: 12px; padding: 0; width: 95%; max-width: 800px; background: #000; margin: auto; overflow: hidden; }
    dialog::backdrop { background: rgba(0,0,0,0.85); }
    .modal-bar { display: flex; justify-content: space-between; align-items: center; background: #161821; padding: 8px 12px; }
    .close-btn { background: #ff7675; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Thanh Header xNhau -->
  <header>
    <div class="header-left">
      <span class="menu-icon">≡</span>
      <a href="#" class="logo">x<span>Nhau</span></a>
      <span class="search-icon">🔍</span>
    </div>
    <div class="header-right">
      <button class="btn-login">Đăng nhập</button>
      <button class="btn-register">Đăng Ký</button>
    </div>
  </header>

  <div class="container">
    <!-- Khu vực Lưới Phim -->
    <div class="grid" id="grid"></div>
  </div>

  <!-- Pop-up phát video -->
  <dialog id="dlg">
    <div class="modal-bar">
      <span style="font-size: 13px; font-weight: bold;">Đang phát</span>
      <button class="close-btn" onclick="closePlayer()">✕ Đóng</button>
    </div>
    <div id="frame" style="width: 100%; aspect-ratio: 16/9; background: #000;"></div>
  </dialog>

  <!-- Gọi file danh sách phim -->
  <script src="movies.js"></script>
  <script>
    const grid = document.getElementById('grid');
    if (typeof MOVIES !== 'undefined') {
      MOVIES.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openPlayer(movie.embed);
        card.innerHTML = `
          <div class="thumb-box">
            <iframe src="${movie.embed}"></iframe>
            <span class="badge-hd">HD</span>
            <span class="badge-time">${movie.duration || '2:00'}</span>
          </div>
          <div class="info">
            <p class="title">${movie.title}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openPlayer(url) {
      document.getElementById('frame').innerHTML = `<iframe src="${url}" width="100%" height="100%" frameborder="0" allowfullscreen style="display:block;"></iframe>`;
      document.getElementById('dlg').showModal();
    }
    function closePlayer() {
      document.getElementById('frame').innerHTML = '';
      document.getElementById('dlg').close();
    }
  </script>
</body>
</html>
